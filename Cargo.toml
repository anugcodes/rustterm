[package]
name = "rustterm"
version = "0.1.0"
edition = "2021"
description = "A lightweight MobaXterm-style SSH client for Linux"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
russh = "0.45"
russh-keys = "0.45"
tokio = { version = "1", features = ["full"] }
alacritty_terminal = "0.24"
pollster = "0.4"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2
lto = true
strip = true
