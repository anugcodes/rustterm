[package]
name = "rustterm"
version = "0.1.0"
edition = "2021"
description = "A lightweight MobaXterm-style SSH client for Linux"
license = "MIT"

[features]
# Enabled for normal builds. Packagers can build a lean binary without the
# Secret Service / zbus stack using `--no-default-features`; the keyring
# checkbox then disappears and passwords are typed manually.
default = ["keyring-secrets"]
keyring-secrets = ["dep:keyring"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
egui_extras = { version = "0.29", default-features = false }
russh = "0.45"
russh-sftp = "3.0"
tokio = { version = "1", features = ["full"] }
alacritty_terminal = "0.24"
async-trait = "0.1"
anyhow = "1"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
keyring = { version = "4.2", optional = true }

[profile.dev]
# `cargo run` is the normal development command; without optimisation the
# terminal renderer and per-byte VTE decoding are painfully slow.
opt-level = 1

[profile.dev.package."*"]
# Dependencies (especially flate2, russh and egui) benefit more from full
# optimisation than from debug assertions during normal app use.
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
